<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oneoff studio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --ink: #fff;
      --dot: #555;
      --gutter: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      justify-content: center;
      align-items: center;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Carousel ---------- */
    .stage {
      position: relative;
      /* full width, same height as before; the video is cropped top/bottom to fill */
      width: calc(100vw - 2 * var(--gutter));
      height: calc(100vh - 240px);
      overflow: hidden;
      background: #000;
    }
    .stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.6s ease;
      cursor: pointer;
    }
    .stage video.active { opacity: 1; }
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      z-index: 1;
    }
    .arrow svg { width: 22px; height: 30px; }
    .arrow.prev { left: 14px; }
    .arrow.next { right: 14px; }

    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }
    .dots button {
      width: 26px;
      height: 2px;
      border: 0;
      background: var(--dot);
      cursor: pointer;
      padding: 0;
    }
    .dots button.active { background: var(--ink); }

    /* ---------- Logo ---------- */
    .logo {
      margin: 0;
      padding: 48px var(--gutter) 0;
      text-align: center;
      font-family: "Archivo", sans-serif;
      font-stretch: 125%;
      font-weight: 600;
      font-size: clamp(32px, 4vw, 72px);
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
    }
    .logo sup {
      font-size: 0.38em;
      vertical-align: -0.05em;
      margin: 0 0.08em 0 0.04em;
    }
  </style>
</head>
<body>

  <section class="stage">
    <video class="active" data-href="https://ria-prism.vercel.app/" src="H0iMHRGUMBErPcS7cN5VJQ.mp4" muted playsinline preload="auto"></video>
    <video data-href="https://bidwiser-lake.vercel.app/" src="49459c6a-77b4-4310-871d-20e12627ce92.mp4" muted playsinline preload="auto"></video>
    <video data-href="https://shimmering-beijinho-fd53b6.netlify.app/" src="YgGPnukFtNkkzuraeLxhNQ.mp4" muted playsinline preload="auto"></video>

    <button class="arrow prev" aria-label="Previous">
      <svg viewBox="0 0 22 30" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 2 4 15l12 13"/></svg>
    </button>
    <button class="arrow next" aria-label="Next">
      <svg viewBox="0 0 22 30" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2l12 13L6 28"/></svg>
    </button>
  </section>

  <div class="dots" id="dots">
    <button class="active" aria-label="Video 1"></button>
    <button aria-label="Video 2"></button>
    <button aria-label="Video 3"></button>
  </div>

  <div class="logo">oneoffstudio<sup>®</sup></div>

  <script>
    // Video carousel: each video plays through, then hands off to the next.
    const videos = [...document.querySelectorAll('.stage video')];
    const dots = [...document.querySelectorAll('#dots button')];
    const n = videos.length;
    let current = 0;

    const go = i => {
      i = (i + n) % n;
      videos[current].pause();
      videos.forEach((v, k) => v.classList.toggle('active', k === i));
      dots.forEach((d, k) => d.classList.toggle('active', k === i));
      current = i;
      videos[i].currentTime = 0;
      videos[i].play();
    };

    videos.forEach(v => v.addEventListener('ended', () => go(current + 1)));
    dots.forEach((d, i) => d.addEventListener('click', () => go(i)));
    document.querySelector('.prev').addEventListener('click', () => go(current - 1));
    document.querySelector('.next').addEventListener('click', () => go(current + 1));

    // Clicking the stage opens the site for whichever video is showing.
    document.querySelector('.stage').addEventListener('click', e => {
      if (e.target.closest('.arrow')) return;
      window.open(videos[current].dataset.href, '_blank', 'noopener');
    });

    videos[0].play();
  </script>
</body>
</html>
